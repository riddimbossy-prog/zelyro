<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="origin" />
  <title>VerzZify</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07010d; overflow: hidden; }
    #player, iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const list = (params.get("list") || params.get("v") || "").split(",").map((s) => s.trim()).filter(Boolean);
    let idx = Math.max(0, list.indexOf(params.get("v") || list[0]));
    let player = null;

    function loadAt(i) {
      if (!list.length || !player) return;
      idx = ((i % list.length) + list.length) % list.length;
      player.loadVideoById(list[idx]);
    }

    function next() { loadAt(idx + 1); }

    window.addEventListener("message", (e) => {
      if (!player || typeof player.getPlayerState !== "function") return;
      const d = e.data || {};
      const cmd = typeof d === "string" ? d : d.cmd;
      if (cmd === "toggle") {
        const s = player.getPlayerState();
        if (s === 1) player.pauseVideo(); else player.playVideo();
      } else if (cmd === "play") player.playVideo();
      else if (cmd === "pause") player.pauseVideo();
      else if (cmd === "next") next();
      else if (cmd === "prev") loadAt(idx - 1);
      else if (cmd === "load" && d.id) {
        const n = list.indexOf(d.id);
        loadAt(n >= 0 ? n : idx);
      }
    });

    window.onYouTubeIframeAPIReady = function () {
      if (!list.length) return;
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: list[idx] || list[0],
        host: "https://www.youtube.com",
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          origin: location.origin,
          enablejsapi: 1,
          fs: 1,
          controls: 1,
        },
        events: {
          onReady(e) { try { e.target.playVideo(); } catch (_) {} },
          onError() { next(); },
          onStateChange(e) { if (e.data === 0) next(); },
        },
      });
    };
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
