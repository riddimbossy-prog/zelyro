<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VerzZify 1-1</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: relative; height: 100%; }
    #remote, #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #12081a; }
    #preview { z-index: 0; }
    #remote { z-index: 1; }
    #shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(180deg, #0008 0%, transparent 28%, transparent 58%, #000c 100%); }
    #local {
      width: 84px; height: 118px; object-fit: cover; border-radius: 16px;
      background: #2a1638; border: 2px solid #ffffff55;
    }
    #top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 4;
      display: flex; align-items: center; gap: 10px; padding: 14px;
    }
    #live { background: #c026d3; font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 6px 10px; border-radius: 999px; }
    #status { font-size: 12px; opacity: .8; }
    #rail {
      position: absolute; right: 10px; bottom: 108px; z-index: 4;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    #rail button, #bar button {
      border: 0; border-radius: 999px; width: 48px; height: 48px;
      background: #ffffff22; color: #fff; font-size: 20px; backdrop-filter: blur(16px); cursor: pointer;
    }
    #bar {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      display: flex; align-items: center; gap: 8px; padding: 12px 12px 18px;
    }
    #chat {
      flex: 1; height: 44px; border: 0; border-radius: 999px; padding: 0 16px;
      background: #ffffff18; color: #fff; backdrop-filter: blur(18px);
    }
    #hang { background: #c026d3 !important; width: 56px; height: 56px; font-size: 13px; font-weight: 800; }
    button.off { background: #5b1a2a !important; }
    #vibes { position: absolute; left: 12px; bottom: 108px; z-index: 4; max-width: 68%; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    #vibes span { background: #0006; backdrop-filter: blur(10px); padding: 6px 10px; border-radius: 14px; font-size: 13px; width: fit-content; }
    .heart { position: absolute; bottom: 140px; z-index: 5; font-size: 28px; pointer-events: none; animation: float 2.1s ease-out forwards; }
    @keyframes float { to { transform: translateY(-48vh) scale(1.35); opacity: 0; } }
  </style>
</head>
<body>
  <div id="stage">
    <video id="preview" autoplay muted playsinline></video>
    <video id="remote" autoplay playsinline></video>
    <div id="shade"></div>
    <div id="top">
      <div id="live">LIVE</div>
      <div id="status">Connecting camera…</div>
    </div>
    <div id="vibes"></div>
    <div id="rail">
      <video id="local" autoplay muted playsinline></video>
      <button id="heart" title="Heart">♥</button>
      <button id="gift" title="Gift">🎁</button>
      <button id="mic" title="Mute">🎙</button>
      <button id="cam" title="Camera">📷</button>
    </div>
    <div id="bar">
      <input id="chat" placeholder="Say something…" maxlength="80" />
      <button id="hang">End</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const room = (params.get("room") || "lobby").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 64) || "lobby";
    const self = ("p" + Math.random().toString(36).slice(2, 10)).slice(0, 64);
    const name = (params.get("name") || "You").slice(0, 64);
    let ice = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }];
    let iceTransportPolicy = "all";
    const $ = (id) => document.getElementById(id);
    const status = (t) => { $("status").textContent = t; };

    let stream = null;
    let pc = null;
    let since = 0;
    let makingOffer = false;
    let ignoreOffer = false;
    let polite = true;
    let remoteId = null;
    let pollTimer = 0;
    let closed = false;
    let pendingIce = [];
    let queuedLocalIce = [];
    let hasTurn = false;
    let path = "gathering";

    function toJson(desc) {
      if (!desc) return null;
      return { type: desc.type, sdp: desc.sdp };
    }

    async function loadIce() {
      try {
        const r = await fetch("/api/v1/ice", { cache: "no-store" });
        const j = await r.json();
        if (Array.isArray(j.iceServers) && j.iceServers.length) ice = j.iceServers;
        iceTransportPolicy = j.iceTransportPolicy || "all";
        hasTurn = Boolean(j.hasTurn);
      } catch {}
    }

    async function signal(to, kind, payload) {
      await fetch("/api/rtc", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ op: "signal", room, from: self, to, kind, payload }),
      });
    }

    async function flushIce() {
      if (!pc?.remoteDescription) return;
      while (pendingIce.length) {
        const c = pendingIce.shift();
        try { await pc.addIceCandidate(c); } catch {}
      }
    }

    async function readPath() {
      if (!pc) return;
      try {
        const stats = await pc.getStats();
        let pair;
        stats.forEach((s) => {
          if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") pair = s;
        });
        if (!pair) return;
        let local;
        stats.forEach((s) => { if (s.id === pair.localCandidateId) local = s; });
        const type = local?.candidateType || "unknown";
        path = type;
        const label = { host: "LAN", srflx: "STUN (public NAT)", prflx: "peer-reflexive", relay: "TURN relay" }[type] || type;
        status("Live · " + label);
      } catch {}
    }

    function ensurePc() {
      if (pc) return pc;
      pc = new RTCPeerConnection({
        iceServers: ice,
        iceTransportPolicy,
        iceCandidatePoolSize: 2,
        bundlePolicy: "max-bundle",
      });
      if (stream) stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      pc.ontrack = (e) => {
        $("remote").srcObject = e.streams[0] || new MediaStream([e.track]);
        status("Connected");
        setTimeout(readPath, 400);
      };
      pc.onicecandidate = (e) => {
        if (!e.candidate) return;
        if (remoteId) void signal(remoteId, "ice", e.candidate.toJSON());
        else queuedLocalIce.push(e.candidate.toJSON());
      };
      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") readPath();
        if (pc.iceConnectionState === "failed") {
          status(hasTurn ? "ICE failed — retrying via TURN…" : "ICE failed — add a TURN server for hard NATs");
          try { pc.restartIce(); } catch {}
        }
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") readPath();
        if (pc.connectionState === "disconnected") status("Reconnecting…");
        if (pc.connectionState === "failed") {
          status("Peer failed");
          try { pc.restartIce(); } catch {}
        }
      };
      pc.onnegotiationneeded = async () => {
        if (!remoteId) return;
        try {
          makingOffer = true;
          await pc.setLocalDescription(await pc.createOffer());
          await signal(remoteId, "offer", toJson(pc.localDescription));
        } catch (err) {
          console.warn(err);
        } finally {
          makingOffer = false;
        }
      };
      return pc;
    }

    async function attachRemote(id) {
      if (remoteId === id) return;
      remoteId = id;
      polite = self < remoteId;
      ensurePc();
      status(polite ? "Waiting for offer…" : "Calling…");
      while (queuedLocalIce.length && remoteId) {
        void signal(remoteId, "ice", queuedLocalIce.shift());
      }
      if (!polite) {
        try {
          makingOffer = true;
          await pc.setLocalDescription(await pc.createOffer());
          await signal(remoteId, "offer", toJson(pc.localDescription));
        } finally {
          makingOffer = false;
        }
      }
    }

    async function onSignal(s) {
      ensurePc();
      if (s.from && s.from !== remoteId) await attachRemote(s.from);
      if (s.kind === "offer") {
        const glare = makingOffer || pc.signalingState !== "stable";
        ignoreOffer = !polite && glare;
        if (ignoreOffer) return;
        if (glare) await pc.setLocalDescription({ type: "rollback" });
        await pc.setRemoteDescription(s.payload);
        await flushIce();
        await pc.setLocalDescription(await pc.createAnswer());
        await signal(s.from, "answer", toJson(pc.localDescription));
      } else if (s.kind === "answer") {
        if (pc.signalingState === "have-local-offer") {
          await pc.setRemoteDescription(s.payload);
          await flushIce();
        }
      } else if (s.kind === "ice") {
        if (!pc.remoteDescription) pendingIce.push(s.payload);
        else {
          try { await pc.addIceCandidate(s.payload); } catch {}
        }
      }
    }

    async function poll() {
      if (closed) return;
      try {
        const r = await fetch(`/api/rtc?room=${encodeURIComponent(room)}&peer=${encodeURIComponent(self)}&name=${encodeURIComponent(name)}&since=${since}`);
        const j = await r.json();
        for (const s of j.signals || []) {
          since = Math.max(since, Number(s.id) || since);
          await onSignal(s);
        }
        const others = (j.peers || []).filter((p) => p.id !== self);
        if (others[0] && others[0].id !== remoteId) await attachRemote(others[0].id);
        if (!others.length) {
          remoteId = null;
          if (pc && pc.connectionState !== "connected") status("Waiting for the other person…");
        }
      } catch {
        status("Signaling retry…");
      }
      pollTimer = setTimeout(poll, pc && pc.connectionState === "connected" ? 2000 : 500);
    }

    async function start() {
      await loadIce();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true,
        });
        $("local").srcObject = stream;
        $("preview").srcObject = stream;
        status(hasTurn ? "Ready (STUN + TURN)" : "Ready (STUN). Hard NATs need TURN.");
      } catch {
        status("Camera blocked — audio-only if the mic is allowed.");
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }); } catch {}
      }
      ensurePc();
      poll();
    }

    $("mic").onclick = () => {
      const t = stream?.getAudioTracks()[0];
      if (!t) return;
      t.enabled = !t.enabled;
      $("mic").classList.toggle("off", !t.enabled);
    };
    $("cam").onclick = () => {
      const t = stream?.getVideoTracks()[0];
      if (!t) return;
      t.enabled = !t.enabled;
      $("cam").classList.toggle("off", !t.enabled);
    };
    function vibe(text) {
      const row = document.createElement("span");
      row.textContent = text;
      $("vibes").appendChild(row);
      while ($("vibes").children.length > 5) $("vibes").firstChild.remove();
    }
    function floatHeart() {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = "♥";
      h.style.right = (10 + Math.random() * 30) + "%";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 2100);
    }
    $("heart").onclick = floatHeart;
    $("gift").onclick = () => { vibe("Sent a gift 🎁"); floatHeart(); };
    $("chat").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const t = $("chat").value.trim();
      if (!t) return;
      vibe(t);
      $("chat").value = "";
    });
    $("hang").onclick = () => {
      closed = true;
      clearTimeout(pollTimer);
      stream?.getTracks().forEach((t) => t.stop());
      pc?.close();
      fetch("/api/rtc", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ op: "leave", room, peer: self }),
        keepalive: true,
      });
      status("Ended");
    };
    window.addEventListener("pagehide", () => {
      fetch("/api/rtc", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ op: "leave", room, peer: self }),
        keepalive: true,
      });
    });

    start();
  </script>
</body>
</html>
