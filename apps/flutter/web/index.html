<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="VerzZify — music, owned by the people who make it." />
    <meta name="theme-color" content="#07010D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="favicon.svg" />
    <title>VerzZify</title>
    <style>
      html, body { height: 100%; margin: 0; background: #07010d; }
      #boot {
        position: fixed; inset: 0; z-index: 80;
        display: grid; place-items: center; background: #07010d;
        transition: opacity .4s ease;
      }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot video {
        width: min(72vw, 420px); height: min(72vw, 420px);
        object-fit: cover; background: #07010d;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-label="VerzZify">
      <video autoplay muted playsinline preload="auto" poster="splash.jpg">
        <source src="splash.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      }
      function hideBoot() {
        var el = document.getElementById("boot");
        if (!el || el.dataset.done) return;
        el.dataset.done = "1";
        el.classList.add("out");
        setTimeout(function () { el.remove(); }, 420);
      }
      document.querySelector("#boot video")?.addEventListener("ended", hideBoot);
      window.addEventListener("flutter-first-frame", hideBoot);
      setTimeout(hideBoot, 6800);
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
